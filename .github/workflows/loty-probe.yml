name: Test API Ryanair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/loty-probe.mjs
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/loty-probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add docs/loty/probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Test API Ryanair"
          git pull --rebase
          git push
