name: Okazje lotnicze (Ryanair, polskie lotniska)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/loty-data.mjs
      - .github/workflows/loty-dane.yml
permissions:
  contents: write
concurrency:
  group: loty-dane
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/loty-data.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add docs/loty/deals.json
          git diff --cached --quiet && exit 0
          git commit -m "Okazje lotnicze: aktualizacja"
          git pull --rebase
          git push
